# am5-spd-diag defaults. Optional overrides: /etc/am5-spd-diag.conf
# This file does not change sleep policy (deep / s2idle).
# Installed capacity is taken from the last healthy capture (baseline.json),
# not from assumed kit size.

STATE_DIR=/var/log/am5-spd-diag
KEEP_DAYS=60

FALLBACK_BOARD="unknown AM5 board"
FALLBACK_CPU="AMD Ryzen AM5"
FALLBACK_MEMORY="DDR5 UDIMM kit"
FALLBACK_BIOS="unknown"

CAPTURE_TIMEOUT_SEC=20
