[package]
name = "am5-spd-diag"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AM5 DDR5 SPD hub diagnostics after sleep/warm reboot"

[lib]
name = "am5_spd_diag"
path = "src/lib.rs"

[[bin]]
name = "am5-spd-diag"
path = "src/bin/am5-spd-diag.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.0"
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.14"
