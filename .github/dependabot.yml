version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      gtk-rs:
        patterns:
          - "gtk4*"
          - "gdk4*"
  # rust-toolchain.toml is the rustc pin. Auto-merge runs sync_rust_pin.sh
  # so OBS Source2, rust-version, and spec Source2 follow the same PR.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
