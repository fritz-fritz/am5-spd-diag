# Same shape as GitHub's Dependabot Actions tutorial, minus repo auto-merge.
# https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions
#
# `gh pr merge --auto` requires Settings → Pull Requests → Allow auto-merge.
# This repo keeps that off, so we wait for the CI job named `test` and then
# squash-merge (Protect Main allows squash only).
#
# When Dependabot bumps rust-toolchain.toml, sync the OBS rustc tarball
# and rust-version on this PR before waiting for CI. GITHUB_TOKEN pushes
# do not retrigger workflows, so dispatch CI onto the new HEAD.

name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'fritz-fritz/am5-spd-diag'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Sync OBS rust pin with rust-toolchain.toml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/sync_rust_pin.sh
          if git diff --quiet && git diff --cached --quiet; then
            echo "rust pin already in sync"
            exit 0
          fi
          git add rust-toolchain.toml Cargo.toml obs/rust-dist.txt am5-spd-diag.spec
          git commit -m "Sync OBS rustc pin with rust-toolchain.toml"
          git push origin "HEAD:$HEAD_REF"
          gh workflow run CI --ref "$HEAD_REF"

      - name: Wait for CI and squash-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))

          check_test() {
            sha=$1
            gh api "repos/$REPO/commits/$sha/check-runs" \
              --jq '[.check_runs[] | select(.name == "test" or .name == "CI / test")]
                    | first | .conclusion // .status // "pending"'
          }

          ci_ok=0
          while (( SECONDS < deadline )); do
            sha=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
            bucket=$(check_test "$sha")
            echo "HEAD $sha CI test: $bucket"
            case "$bucket" in
              failure|cancelled|timed_out|startup_failure|stale)
                echo "CI test failed ($bucket)" >&2
                exit 1
                ;;
              success)
                ci_ok=1
                break
                ;;
            esac
            sleep 15
          done
          if [ "$ci_ok" -ne 1 ]; then
            echo "timed out waiting for CI test" >&2
            exit 1
          fi

          while (( SECONDS < deadline )); do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            status=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            echo "mergeStateStatus=$status"
            case "$status" in
              DIRTY|DRAFT)
                echo "PR cannot be merged ($status)" >&2
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "timed out waiting for the PR to become mergeable" >&2
          exit 1
