name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags-ignore:
      - "**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config python3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check packaging versions agree
        run: python3 scripts/bump_version.py --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: make test
