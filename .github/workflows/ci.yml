name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config python3

      - name: Read rustc pin
        id: rust
        run: echo "version=$(scripts/rust_pin.sh channel)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: Check packaging versions agree
        run: |
          python3 scripts/bump_version.py --check
          python3 scripts/check_rust_pin.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: make test
