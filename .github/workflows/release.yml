# Cut a release by tagging vX.Y.Z on the default branch after a local version bump.
#
# Maintainer flow:
#   1. make bump TO=X.Y.Z MSG='Why this release.'
#   2. Review the diff (lockfile, changelogs, packaging) and commit.
#   3. Merge to the default branch (PR CI aggregator job `ci` is the required
#      check; it fails unless test, dist, and every osc-build cell passed), then:
#        git tag vX.Y.Z && git push origin vX.Y.Z
#
# Tags that are not ancestors of the default branch (including tags pushed
# from a PR) do not publish a GitHub Release and do not commit to OBS.
# workflow_dispatch can attach binaries or, with commit_obs, upload sources.
#
# Dist packs the tagged tree with the workflow revision's Makefile, so a
# later dist-recipe fix can rebuild Source0 for an already-published tag
# without moving it. Tests still run in the tagged tree. Orchestration
# scripts (osc wait, notes, version gate) also come from the workflow
# revision.
#
# Immutable GitHub Releases: published assets cannot be added or
# replaced. OBS packages still publish; notes can be edited. Linear
# history on master only affects how PRs merge (squash); it does not
# require a new tag.
#
# Repository secrets:
#   OBS_USER      OBS account that owns home:fritz-fritz
#   OBS_PASSWORD  that account's password for osc (commit queues the
#                 build; obs_wait may rebuildpac a failed repo/arch once)
#
# workflow_dispatch of a previous tag checks out that tag. Leave
# commit_obs off to attach binaries already on OBS. Turn it on to upload
# that tag's Source0, vendor archive, and pinned rustc. Refused if OBS
# already has a newer Version,
# unless force_obs_commit (would roll the live package back).

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach OBS binaries to (vX.Y.Z)
        required: true
        type: string
      commit_obs:
        description: Upload this tag's Source0, vendor archive, and rustc to OBS (refused if OBS is already newer)
        required: false
        type: boolean
        default: false
      force_obs_commit:
        description: Overwrite a newer live OBS package with this older tag
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  OBS_PROJECT: home:fritz-fritz
  OBS_PACKAGE: am5-spd-diag
  OBS_DOWNLOAD: https://software.opensuse.org/download/package?package=am5-spd-diag&project=home:fritz-fritz

jobs:
  # Tag pushes from a PR branch still show this workflow as a check.
  # Do not dist, publish, or osc commit unless the tagged commit is on
  # the default branch (or the maintainer dispatched explicitly).
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.g.outputs.publish }}
      obs: ${{ steps.g.outputs.obs }}
    steps:
      - name: Allow publish only from the default branch
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_OBS: ${{ (github.event_name == 'workflow_dispatch' && inputs.commit_obs) || false }}
        run: |
          set -euo pipefail
          default=$(gh api "repos/$REPO" --jq .default_branch)
          echo "default_branch=$default"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "$COMMIT_OBS" = "true" ]; then
              echo "obs=true" >> "$GITHUB_OUTPUT"
            else
              echo "obs=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          ahead=$(gh api "repos/$REPO/compare/${default}...${SHA}" --jq .ahead_by)
          echo "compare ${default}...${SHA} ahead_by=$ahead"
          if [ "$ahead" = "0" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "obs=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag is not on ${default} (ahead_by=$ahead). Skipping GitHub Release and OBS commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "obs=false" >> "$GITHUB_OUTPUT"
          fi

  skipped:
    needs: gate
    if: needs.gate.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Do not publish from a PR tag
        run: echo "Tag is not on the default branch; no GitHub Release and no OBS commit."

  release:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: am5-spd-diag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: am5-spd-diag
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Notes/scripts come from the workflow revision (master on dispatch),
      # not the tag. Dist still packs the tagged tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow-src
          ref: ${{ github.sha }}

      - name: Resolve tag
        id: ver
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must be vX.Y.Z (got $tag)" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "tag must be vX.Y.Z (got $tag)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Record tagged commit
        id: src
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Tagged tree $sha ($(git describe --tags --always --dirty))"

      - name: Install build deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config python3 osc zstd xz-utils curl

      - name: Read rustc pin
        id: rust
        run: echo "version=$(../workflow-src/scripts/rust_pin.sh channel rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: Check versions match tag
        run: python3 scripts/bump_version.py --check "${{ steps.ver.outputs.version }}"

      - name: Test
        run: make test

      - name: Dist
        run: |
          make -f ../workflow-src/Makefile dist VERSION="${{ steps.ver.outputs.version }}"
          make -f ../workflow-src/Makefile osc-fetch-rust
          tarball="../${{ env.OBS_PACKAGE }}-${{ steps.ver.outputs.version }}.tar.xz"
          vendor="../${{ env.OBS_PACKAGE }}-${{ steps.ver.outputs.version }}-vendor.tar.zst"
          rust="../$(../workflow-src/scripts/rust_pin.sh file obs/rust-dist.txt)"
          ls -la "$tarball" "$vendor" "$rust"
          test -s "$tarball"
          test -s "$vendor"
          test -s "$rust"
          tar -tJf "$tarball" | grep -q '/am5-spd-diag.changes$'
          tar -tJf "$tarball" | grep -q '/am5-spd-diag.spec$'
          tar -tJf "$tarball" | grep -q '/debian/changelog$'
          ! tar -tJf "$tarball" | grep -q '/vendor/'
          cp -f "$tarball" "$vendor" "$rust" .

      - name: Configure osc
        id: osc
        working-directory: .
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          if [ -z "$OBS_USER" ] || [ -z "$OBS_PASSWORD" ]; then
            echo "::warning::OBS_USER or OBS_PASSWORD is empty; publishing the source tarball only."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/oscrc" <<EOF
          [general]
          apiurl = https://api.opensuse.org
          [https://api.opensuse.org]
          user = $OBS_USER
          pass = $OBS_PASSWORD
          credentials_mgr_class = osc.credentials.PlaintextConfigFileCredentialsManager
          EOF
          chmod 600 "$RUNNER_TEMP/oscrc"

      - name: OBS version gate
        id: obsgate
        if: needs.gate.outputs.obs == 'true' && steps.osc.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_obs_commit == true }}
        working-directory: .
        run: |
          osc="osc -c $RUNNER_TEMP/oscrc"
          spec="$RUNNER_TEMP/obs-live.spec"
          if $osc cat "$OBS_PROJECT" "$OBS_PACKAGE" "$OBS_PACKAGE.spec" > "$spec"; then
            true
          else
            rm -f "$spec"
          fi
          force=()
          if [ "$FORCE" = true ]; then
            force+=(--force)
          fi
          python3 workflow-src/scripts/obs_release.py \
            --version "$VERSION" \
            --spec "$spec" \
            --github-output "$GITHUB_OUTPUT" \
            "${force[@]}"

      - name: Commit tagged sources to OBS
        if: needs.gate.outputs.obs == 'true' && steps.osc.outputs.skip != 'true' && steps.obsgate.outputs.commit == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          osc="osc -c $RUNNER_TEMP/oscrc"
          src="$PWD"
          pkg="$RUNNER_TEMP/obs-pkg"
          rust=$(../workflow-src/scripts/rust_pin.sh file obs/rust-dist.txt)
          $osc meta prjconf "$OBS_PROJECT" -F ../workflow-src/obs/prjconf
          $osc meta pkg "$OBS_PROJECT" "$OBS_PACKAGE" -F ../workflow-src/obs/package-meta.xml
          $osc checkout "$OBS_PROJECT" "$OBS_PACKAGE" -o "$pkg"
          cp -f "$src/$OBS_PACKAGE-$VERSION.tar.xz" "$src/$OBS_PACKAGE-$VERSION-vendor.tar.zst" "$pkg/"
          if [ -f "$pkg/$rust" ] && cmp -s "$src/$rust" "$pkg/$rust"; then
            echo "Source2 $rust unchanged (skip re-upload)"
          else
            cp -f "$src/$rust" "$pkg/"
          fi
          cp -f "$src/$OBS_PACKAGE.spec" "$src/$OBS_PACKAGE.changes" "$src/$OBS_PACKAGE.dsc" "$pkg/"
          cp -f "$src/$OBS_PACKAGE.rpmlintrc" "$pkg/"
          cp -f "$src"/debian.control "$src"/debian.changelog "$src"/debian.rules \
            "$src"/debian.compat "$src"/debian.copyright "$pkg/"
          msg="$RUNNER_TEMP/obs-commit-msg.txt"
          since_args=()
          if since=$(gh release list --limit 1 --json publishedAt \
            --jq '.[0].publishedAt // empty' 2>/dev/null) && [ -n "$since" ]; then
            since_args+=(--since "$since")
          fi
          python3 ../workflow-src/scripts/obs_commit_msg.py \
            --version "$VERSION" --tag "$TAG" --sha "$SOURCE_SHA" \
            --changes "$src/$OBS_PACKAGE.changes" \
            "${since_args[@]}" | tee "$msg"
          (
            cd "$pkg"
            for old in "$OBS_PACKAGE"-*.tar.xz; do
              [ -e "$old" ] || continue
              [ "$old" = "$OBS_PACKAGE-$VERSION.tar.xz" ] && continue
              $osc rm --force "$old" || rm -f "$old"
            done
            for old in "$OBS_PACKAGE"-*-vendor.tar.zst; do
              [ -e "$old" ] || continue
              [ "$old" = "$OBS_PACKAGE-$VERSION-vendor.tar.zst" ] && continue
              $osc rm --force "$old" || rm -f "$old"
            done
            $osc add "$OBS_PACKAGE-$VERSION.tar.xz" || true
            $osc add "$OBS_PACKAGE-$VERSION-vendor.tar.zst" || true
            $osc add "$rust" || true
            $osc add "$OBS_PACKAGE.rpmlintrc" || true
            $osc commit -F "$msg"
          )

      - name: Wait for OBS binaries
        if: steps.osc.outputs.skip != 'true'
        working-directory: .
        run: |
          python3 workflow-src/scripts/obs_wait.py \
            --config "$RUNNER_TEMP/oscrc" \
            --project "$OBS_PROJECT" \
            --package "$OBS_PACKAGE" \
            --version "${{ steps.ver.outputs.version }}"

      - name: Collect OBS binaries
        if: steps.osc.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        working-directory: .
        run: |
          dest="$RUNNER_TEMP/obs-bins"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$dest" "$assets"
          python3 workflow-src/scripts/obs_wait.py \
            --config "$RUNNER_TEMP/oscrc" \
            --project "$OBS_PROJECT" \
            --package "$OBS_PACKAGE" \
            --version "$VERSION" \
            --getbinaries "$dest"
          find "$dest" -type f \( -name '*.rpm' -o -name '*.deb' \) | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *.src.rpm|*debuginfo*|*debugsource*|*dbgsym*) continue ;;
            esac
            case "$base" in
              *"$VERSION"*) ;;
              *) continue ;;
            esac
            rel=${f#"$dest"/}
            repo=${rel%%/*}
            destname=$(python3 workflow-src/scripts/obs_wait.py --asset-name "$repo" "$base")
            cp -f "$f" "$assets/$destname"
          done
          cp -f "am5-spd-diag/$OBS_PACKAGE-$VERSION.tar.xz" "$assets/"
          count=$(find "$assets" -type f | wc -l)
          echo "Collected $count release assets:"
          ls -l "$assets"
          if [ "$count" -lt 2 ]; then
            echo "expected source tarball plus at least one OBS package" >&2
            exit 1
          fi

      - name: Stage source tarball
        if: steps.osc.outputs.skip == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp -f "$OBS_PACKAGE-$VERSION.tar.xz" "$RUNNER_TEMP/release-assets/"
          ls -l "$RUNNER_TEMP/release-assets"

      - name: Write SHA256SUMS
        working-directory: .
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/release-assets"
          test -d "$assets"
          (
            cd "$assets"
            sha256sum -- * > SHA256SUMS
          )
          grep -F "am5-spd-diag-$VERSION.tar.xz" "$assets/SHA256SUMS"
          cat "$assets/SHA256SUMS"

      - name: Attest GitHub-produced artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/am5-spd-diag-${{ steps.ver.outputs.version }}.tar.xz
            ${{ runner.temp }}/release-assets/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          PENDING_OBS: ${{ steps.osc.outputs.skip }}
        working-directory: .
        run: |
          tarball="am5-spd-diag/am5-spd-diag-$VERSION.tar.xz"
          extra=()
          # Notes script is checked out at github.sha (workflow-src).
          if [ "$PENDING_OBS" = true ] && \
             python3 workflow-src/scripts/release_notes.py -h 2>&1 | grep -q -- '--pending-obs'; then
            extra+=(--pending-obs)
          fi
          assets=("$RUNNER_TEMP"/release-assets/*)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            existing=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
            tarname=$(basename "$tarball")
            if printf '%s\n' "$existing" | grep -qxF "$tarname"; then
              # Hash the immutable GitHub tarball, not a later dist rebuild.
              gh release download "$TAG" --repo "$REPO" -p "$tarname" -D "$RUNNER_TEMP/gh-tar"
              sha256=$(sha256sum "$RUNNER_TEMP/gh-tar/$tarname" | awk '{print $1}')
            else
              sha256=$(sha256sum "$tarball" | awk '{print $1}')
            fi
            notes=$(python3 workflow-src/scripts/release_notes.py \
              --version "$VERSION" \
              --sha256 "$sha256" \
              --download "$OBS_DOWNLOAD" \
              --changes am5-spd-diag/am5-spd-diag.changes \
              "${extra[@]}")
            immutable=
            for a in "${assets[@]}"; do
              name=$(basename "$a")
              if printf '%s\n' "$existing" | grep -qxF "$name"; then
                echo "keeping existing $name (immutable releases cannot replace assets)"
                continue
              fi
              if [ -n "$immutable" ]; then
                echo "not attaching $name (GitHub Release $TAG is immutable)"
                continue
              fi
              if ! out=$(gh release upload "$TAG" "$a" --repo "$REPO" 2>&1); then
                printf '%s\n' "$out"
                if printf '%s\n' "$out" | grep -qi 'immutable'; then
                  echo "GitHub Release $TAG is immutable; OBS packages stay on the download page"
                  immutable=1
                  continue
                fi
                exit 1
              fi
            done
            if [ "$PENDING_OBS" != true ] || [ "${#extra[@]}" -gt 0 ]; then
              gh release edit "$TAG" --repo "$REPO" --notes "$notes"
            else
              echo "leaving existing release notes (tag tree cannot describe a skipped OBS run)"
            fi
          else
            sha256=$(sha256sum "$tarball" | awk '{print $1}')
            notes=$(python3 workflow-src/scripts/release_notes.py \
              --version "$VERSION" \
              --sha256 "$sha256" \
              --download "$OBS_DOWNLOAD" \
              --changes am5-spd-diag/am5-spd-diag.changes \
              "${extra[@]}")
            gh release create "$TAG" "${assets[@]}" --repo "$REPO" --title "$TAG" --notes "$notes"
          fi
