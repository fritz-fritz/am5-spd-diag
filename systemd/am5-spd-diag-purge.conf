# Recursively remove the system capture tree. This file is NOT installed
# under tmpfiles.d: systemd-tmpfiles-setup.service passes --remove at boot,
# which would wipe logs every reboot. purge runs:
#   systemd-tmpfiles --remove $this
#   systemd-tmpfiles --create /usr/lib/tmpfiles.d/am5-spd-diag.conf
R /var/log/am5-spd-diag
