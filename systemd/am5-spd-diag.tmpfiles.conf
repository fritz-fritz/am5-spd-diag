# Type Path Mode User Group Age Argument
d /var/log/am5-spd-diag 0755 root root -
d /var/log/am5-spd-diag/events 0755 root root -
d /var/log/am5-spd-diag/reports 0755 root root -
d /var/log/am5-spd-diag/packages 0755 root root -
d /var/log/am5-spd-diag/latest 0755 root root -
f /var/log/am5-spd-diag/hook.log 0644 root root -
# Recursively re-own leftover files (for example from an older 2775 tree).
# ~0755 keeps non-executable files 0644; directories stay 0755. Does not follow
# symlinks. Not a boot wipe: type Z is --create only.
Z /var/log/am5-spd-diag ~0755 root root -
